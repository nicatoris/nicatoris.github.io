<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN party flyer</title>

<!-- ============================================================
     EDIT YOUR EVENT DETAILS IN THE <script> BLOCK AT THE BOTTOM.
     Everything else can stay as-is.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
  :root{
    --screen:#050B06;
    --phosphor:#3DFF74;
    --dim:#1C7A3D;
    --amber:#FFB000;
    --fringe-a:#FF2D7A;
    --fringe-b:#00C2FF;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    background:#000;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* The flyer is a fixed 1080x1920 canvas (Instagram Story size)
     scaled down to fit whatever screen you open it on. */
  #stage{
    width:1080px;
    height:1920px;
    flex:0 0 auto;
    position:relative;
    overflow:hidden;
    background:var(--screen);
    color:var(--phosphor);
    font-family:'VT323',ui-monospace,monospace;
    transform-origin:center center;
    animation:flicker 5s steps(2) infinite;
  }
  @keyframes flicker{
    0%,96%,100%{opacity:1}
    97%{opacity:.88}
    98%{opacity:1}
    99%{opacity:.93}
  }

  /* ---- scanlines ---- */
  #stage::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 3px,
      rgba(0,0,0,.42) 4px,
      rgba(0,0,0,.42) 6px
    );
    pointer-events:none;
    z-index:8;
  }

  /* ---- tube vignette ---- */
  #stage::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.85) 100%);
    pointer-events:none;
    z-index:9;
  }

  /* ---- slow refresh band sweeping down the tube ---- */
  .sweep{
    position:absolute; left:0; right:0;
    height:340px;
    background:linear-gradient(to bottom, transparent, rgba(61,255,116,.07), transparent);
    animation:sweep 7s linear infinite;
    z-index:7;
    pointer-events:none;
  }
  @keyframes sweep{
    from{transform:translateY(-340px)}
    to  {transform:translateY(1920px)}
  }

  .screen{
    position:absolute;
    inset:0;
    padding:96px 78px;
    display:flex;
    flex-direction:column;
    z-index:2;
  }

  /* ---- title, with CRT convergence fringing ---- */
  .title{
    position:relative;
    margin-top:60px;
    height:420px;
  }
  .title .plate{
    position:absolute; top:0; left:0; right:0;
    font-family:'Press Start 2P',monospace;
    font-size:158px;
    line-height:1.28;
  }
  .plate.a{color:var(--fringe-a); mix-blend-mode:screen; animation:conv 4s ease-in-out infinite}
  .plate.b{color:var(--fringe-b); mix-blend-mode:screen; animation:conv 4s ease-in-out infinite reverse}
  .plate.main{color:var(--phosphor); text-shadow:0 0 26px rgba(61,255,116,.55)}

  @keyframes conv{
    0%,100%{transform:translate(6px,-3px)}
    50%    {transform:translate(-6px,3px)}
  }

  .strap{
    font-size:46px;
    line-height:1.35;
    color:var(--amber);
    margin-top:8px;
    max-width:26ch;
  }

  /* ---- the config readout, typed line by line ---- */
  .readout{
    margin-top:auto;
    font-size:46px;
    line-height:1.5;
  }
  .readout .row{
    white-space:nowrap;
    overflow:hidden;
    width:0;
  }
  #stage.go .readout .row{
    animation:type .5s steps(40,end) forwards;
  }
  @keyframes type{to{width:100%}}

  .readout .dots{color:var(--dim)}
  .readout .val{color:#EAFFF0}

  .games{
    margin-top:44px;
    font-size:52px;
    line-height:1.35;
    color:var(--amber);
  }
  .games .row{white-space:nowrap;overflow:hidden;width:0}
  #stage.go .games .row{animation:type .45s steps(40,end) forwards}

  .cursorline{
    margin-top:44px;
    font-size:48px;
    color:var(--phosphor);
  }
  .cursor{
    display:inline-block;
    width:26px; height:38px;
    background:var(--phosphor);
    vertical-align:-4px;
    margin-left:6px;
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  /* ---- status bar ---- */
  .foot{
    position:absolute;
    left:0; right:0; bottom:0;
    height:92px;
    background:var(--phosphor);
    color:var(--screen);
    display:flex; align-items:center;
    overflow:hidden;
    white-space:nowrap;
    z-index:5;
    font-size:40px;
    letter-spacing:.06em;
  }
  .ticker{
    display:inline-block;
    padding-left:100%;
    animation:slide 24s linear infinite;
  }
  @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-100%)}}

  @media (prefers-reduced-motion:reduce){
    #stage,.sweep,.plate,.ticker,.cursor{animation:none !important}
    .readout .row,.games .row{width:100% !important;animation:none !important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="sweep"></div>

  <div class="screen">
    <div class="title">
      <div class="plate a" id="titleA"></div>
      <div class="plate b" id="titleB"></div>
      <div class="plate main" id="titleMain"></div>
    </div>

    <div class="strap" id="strap"></div>

    <div class="readout" id="readout"></div>
    <div class="games" id="games"></div>

    <div class="cursorline"><span id="cta"></span><span class="cursor"></span></div>
  </div>

  <div class="foot"><span class="ticker" id="ticker"></span></div>
</div>

<script>
/* ==========================================================
   1. EDIT THIS BLOCK. Keep the quote marks around each value.
   ========================================================== */
const EVENT = {
  title    : "FRAG<br>FEST",      // <br> starts a new line
  strap    : "48 hours. Bring your own rig.",

  // Left label and right value. Add or delete lines freely.
  specs    : [
    ["DATE",     "SAT 14 MAR / 18:00"],
    ["RUNTIME",  "48 HOURS NONSTOP"],
    ["SEATS",    "64 / BYOC"],
    ["NETWORK",  "GIGABIT / CAT5 PROVIDED"],
    ["LOCATION", "FORT LAUDERDALE FL"]
  ],

  games    : ["QUAKE III ARENA", "COUNTER-STRIKE 1.6", "UNREAL TOURNAMENT", "STARCRAFT"],

  cta      : "RSVP: link in bio",
  ticker   : "BRING A POWER STRIP • NO ROUTERS • MONITOR + TOWER ONLY • DOORS 18:00"
};
/* ========================================================== */


// --- fills the flyer with your details ---
document.getElementById('strap').innerHTML       = EVENT.strap;
document.getElementById('cta').textContent       = EVENT.cta;

['titleA','titleB','titleMain'].forEach(function(id){
  document.getElementById(id).innerHTML = EVENT.title;
});

// pads each label with dots so the values line up
var pad = 11;
document.getElementById('readout').innerHTML = EVENT.specs.map(function(row, i){
  var dots = '.'.repeat(Math.max(2, pad - row[0].length));
  return '<div class="row" style="animation-delay:' + (0.4 + i * 0.35) + 's">'
       + '&gt; ' + row[0] + ' <span class="dots">' + dots + '</span> '
       + '<span class="val">' + row[1] + '</span></div>';
}).join('');

var gameStart = 0.4 + EVENT.specs.length * 0.35 + 0.3;
document.getElementById('games').innerHTML = EVENT.games.map(function(g, i){
  return '<div class="row" style="animation-delay:' + (gameStart + i * 0.3) + 's">'
       + '[' + (i + 1) + '] ' + g + '</div>';
}).join('');

document.getElementById('ticker').textContent = (EVENT.ticker + ' • ').repeat(4);

// --- replays the boot sequence every 16 seconds ---
var stage = document.getElementById('stage');
function play(){
  stage.classList.remove('go');
  void stage.offsetWidth;          // forces the browser to restart the animation
  stage.classList.add('go');
}
play();
setInterval(play, 16000);

// --- scales the 1080x1920 flyer to fit your screen ---
function fit(){
  var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  stage.style.transform = 'scale(' + scale + ')';
  stage.style.margin = (1920 * scale - 1920) / 2 + 'px ' + (1080 * scale - 1080) / 2 + 'px';
}
fit();
window.addEventListener('resize', fit);
</script>

</body>
</html>
