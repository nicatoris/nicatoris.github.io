<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAN party flyer</title>

<!-- ============================================================
     EDIT YOUR EVENT DETAILS IN THE <script> BLOCK AT THE BOTTOM.
     Everything else can stay as-is.
     ============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

<style>
  :root{
    --screen:#03070F;
    --phosphor:#3DE3FF;
    --dim:#1B5C7C;
    --amber:#9D7BFF;
    --fringe-a:#FF3DA1;
    --fringe-b:#2D5BFF;
  }

  *{margin:0;padding:0;box-sizing:border-box}

  body{
    background:#000;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* The flyer is a fixed 1080x1920 canvas (Instagram Story size)
     scaled down to fit whatever screen you open it on. */
  #stage{
    width:1080px;
    height:1920px;
    flex:0 0 auto;
    position:relative;
    overflow:hidden;
    background:var(--screen);
    color:var(--phosphor);
    font-family:'VT323',ui-monospace,monospace;
    transform-origin:center center;
    animation:flicker 5s steps(2) infinite;
  }
  @keyframes flicker{
    0%,96%,100%{opacity:1}
    97%{opacity:.88}
    98%{opacity:1}
    99%{opacity:.93}
  }

  /* ---- scanlines ---- */
  #stage::before{
    content:"";
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 3px,
      rgba(0,0,0,.42) 4px,
      rgba(0,0,0,.42) 6px
    );
    pointer-events:none;
    z-index:8;
  }

  /* ---- tube vignette ---- */
  #stage::after{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.85) 100%);
    pointer-events:none;
    z-index:9;
  }

  /* ---- slow refresh band sweeping down the tube ---- */
  .sweep{
    position:absolute; left:0; right:0;
    height:340px;
    background:linear-gradient(to bottom, transparent, rgba(61,227,255,.07), transparent);
    animation:sweep 7s linear infinite;
    z-index:7;
    pointer-events:none;
  }
  @keyframes sweep{
    from{transform:translateY(-340px)}
    to  {transform:translateY(1920px)}
  }

  .screen{
    position:absolute;
    inset:0;
    padding:96px 78px;
    display:flex;
    flex-direction:column;
    z-index:2;
  }

  /* ---- title, with CRT convergence fringing ---- */
  .title{
    position:relative;
    margin-top:60px;
    height:420px;
  }
  .title .plate{
    position:absolute; top:0; left:0; right:0;
    font-family:'Press Start 2P',monospace;
    font-size:158px;
    line-height:1.28;
  }
  .plate.a{color:var(--fringe-a); mix-blend-mode:screen; animation:conv 4s ease-in-out infinite}
  .plate.b{color:var(--fringe-b); mix-blend-mode:screen; animation:conv 4s ease-in-out infinite reverse}
  .plate.main{color:var(--phosphor); text-shadow:0 0 26px rgba(61,227,255,.55)}

  @keyframes conv{
    0%,100%{transform:translate(6px,-3px)}
    50%    {transform:translate(-6px,3px)}
  }

  .strap{
    font-size:46px;
    line-height:1.35;
    color:var(--amber);
    margin-top:8px;
    max-width:26ch;
  }

  /* ---- the config readout, typed line by line ---- */
  .readout{
    margin-top:auto;
    font-size:46px;
    line-height:1.5;
  }
  .readout .row{
    white-space:nowrap;
    overflow:hidden;
    width:0;
  }
  #stage.go .readout .row{
    animation:type .5s steps(40,end) forwards;
  }
  @keyframes type{to{width:100%}}

  .readout .dots{color:var(--dim)}
  .readout .val{color:#EAF7FF}

  .games{
    margin-top:44px;
    font-size:52px;
    line-height:1.35;
    color:var(--amber);
  }
  .games .row{white-space:nowrap;overflow:hidden;width:0}
  #stage.go .games .row{animation:type .45s steps(40,end) forwards}

  /* ---- RSVP panel ---- */
  .cursorline{
    align-self:flex-start;
    margin-top:52px;
    padding:22px 30px;
    font-size:62px;
    line-height:1;
    color:var(--phosphor);
    border:5px solid var(--phosphor);
    background:rgba(61,227,255,.10);
    text-shadow:0 0 18px rgba(61,227,255,.7);
    opacity:0;
  }
  #stage.go .cursorline{
    animation:popin .4s ease-out forwards, pulse 1.8s ease-in-out infinite;
  }
  @keyframes popin{
    from{opacity:0; transform:translateY(14px)}
    to  {opacity:1; transform:translateY(0)}
  }
  @keyframes pulse{
    0%,100%{box-shadow:0 0 26px rgba(61,227,255,.22), inset 0 0 18px rgba(61,227,255,.06)}
    50%    {box-shadow:0 0 62px rgba(61,227,255,.60), inset 0 0 34px rgba(61,227,255,.18)}
  }
  .cursor{
    display:inline-block;
    width:30px; height:48px;
    background:var(--phosphor);
    vertical-align:-6px;
    margin-left:10px;
    box-shadow:0 0 20px rgba(61,227,255,.8);
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  /* ---- status bar ---- */
  .foot{
    position:absolute;
    left:0; right:0; bottom:0;
    height:92px;
    background:var(--phosphor);
    color:var(--screen);
    display:flex; align-items:center;
    overflow:hidden;
    z-index:5;
    font-size:40px;
    letter-spacing:.06em;
  }

  /* Two identical copies sit side by side. Sliding left by exactly one
     copy loops seamlessly, so the bar is full from the first frame. */
  .marquee{
    display:flex;
    flex:0 0 auto;
    will-change:transform;
    animation:slide 20s linear infinite;
  }
  .marquee span{
    flex:0 0 auto;
    white-space:nowrap;
  }
  @keyframes slide{
    from{transform:translateX(0)}
    to  {transform:translateX(-50%)}
  }

  @media (prefers-reduced-motion:reduce){
    #stage,.sweep,.plate,.marquee,.cursor,.cursorline{animation:none !important}
    .cursorline{opacity:1 !important}
    .readout .row,.games .row{width:100% !important;animation:none !important}
  }
</style>
</head>
<body>

<div id="stage">
  <div class="sweep"></div>

  <div class="screen">
    <div class="title">
      <div class="plate a" id="titleA"></div>
      <div class="plate b" id="titleB"></div>
      <div class="plate main" id="titleMain"></div>
    </div>

    <div class="strap" id="strap"></div>

    <div class="readout" id="readout"></div>
    <div class="games" id="games"></div>

    <div class="cursorline"><span id="cta"></span><span class="cursor"></span></div>
  </div>

  <div class="foot">
    <div class="marquee" id="marquee">
      <span id="tickerA"></span>
      <span id="tickerB"></span>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   1. EDIT THIS BLOCK. Keep the quote marks around each value.
   ========================================================== */
const EVENT = {
  title    : "LOCAL<br>HOST",      // <br> starts a new line
  strap    : "at TorisCorp Headquarters",

  // Left label and right value. Add or delete lines freely.
  specs    : [
    ["DATE",      "SATURDAY, SEPTEMBER 5TH - 9:00 PM"],
    ["INFO",      "BRING YOUR OWN PC"],
    ["SEATS",     "LIMITED SEATS & MONITORS AVAILABLE"],
    ["INCLUDED",  "DRINKS PROVIDED"],
    ["LOCATION",  "FORT LAUDERDALE, FLORIDA"]
  ],

  games    : ["COUNTER-STRIKE", "FIFA", "HALO", "AND MORE"],

  cta      : "RSVP: DM @NICATORIS FOR ADDRESS",
  ticker   : "BRING PC, KEYBOARD, AND MOUSE • TEA AND DRINKS PROVIDED • LIMITED MONITORS AVAILABLE • 9PM TO LATE",

  // Bottom bar scroll speed, in pixels per second.
  // Higher is faster. 90 is slow and readable, 200 is brisk.
  tickerSpeed: 130
};
/* ========================================================== */


// --- fills the flyer with your details ---
document.getElementById('strap').innerHTML = EVENT.strap;
document.getElementById('cta').textContent = EVENT.cta;

['titleA','titleB','titleMain'].forEach(function(id){
  document.getElementById(id).innerHTML = EVENT.title;
});

// pads each label with dots so the values line up
var pad = 11;
document.getElementById('readout').innerHTML = EVENT.specs.map(function(row, i){
  var dots = '.'.repeat(Math.max(2, pad - row[0].length));
  return '<div class="row" style="animation-delay:' + (0.4 + i * 0.35) + 's">'
       + '&gt; ' + row[0] + ' <span class="dots">' + dots + '</span> '
       + '<span class="val">' + row[1] + '</span></div>';
}).join('');

var gameStart = 0.4 + EVENT.specs.length * 0.35 + 0.3;
document.getElementById('games').innerHTML = EVENT.games.map(function(g, i){
  return '<div class="row" style="animation-delay:' + (gameStart + i * 0.3) + 's">'
       + '[' + (i + 1) + '] ' + g + '</div>';
}).join('');

// makes the RSVP box land last, after the games list has finished typing
var ctaStart = gameStart + EVENT.games.length * 0.3 + 0.35;
document.querySelector('.cursorline').style.animationDelay =
  ctaStart + 's, ' + (ctaStart + 0.4) + 's';

// --- bottom bar: fill the width first, then match speed to text length ---
var marquee = document.getElementById('marquee');
var tickerA = document.getElementById('tickerA');
var tickerB = document.getElementById('tickerB');

function buildTicker(){
  var unit = EVENT.ticker + '  \u2022  ';
  var reps = 1;
  tickerA.textContent = unit;
  // repeat the line until one copy is wider than the flyer, so the bar
  // is never empty at any point in the loop
  while(tickerA.offsetWidth < 1080 && reps < 30){
    reps++;
    tickerA.textContent = unit.repeat(reps);
  }
  tickerB.textContent = tickerA.textContent;
  marquee.style.animationDuration = (tickerA.offsetWidth / EVENT.tickerSpeed) + 's';
}

buildTicker();
// remeasure once the fonts have loaded, otherwise the widths are wrong
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(buildTicker); }

// --- replays the boot sequence every 16 seconds ---
var stage = document.getElementById('stage');
function play(){
  stage.classList.remove('go');
  void stage.offsetWidth;          // forces the browser to restart the animation
  stage.classList.add('go');
}
play();
setInterval(play, 16000);

// --- scales the 1080x1920 flyer to fit your screen ---
function fit(){
  var scale = Math.min(window.innerWidth / 1080, window.innerHeight / 1920);
  stage.style.transform = 'scale(' + scale + ')';
  stage.style.margin = (1920 * scale - 1920) / 2 + 'px ' + (1080 * scale - 1080) / 2 + 'px';
}
fit();
window.addEventListener('resize', fit);
</script>

</body>
</html>
